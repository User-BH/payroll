# ---------------------------------------------------------------------------
# سامانه حقوق و دستمزد — تامین کالا باختر
#
# نصب:
#   sudo cp deploy/nginx/payroll.conf /etc/nginx/sites-available/payroll
#   sudo ln -sf /etc/nginx/sites-available/payroll /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# این فایل فقط همین یک سایت را تعریف می‌کند و به بقیه‌ی سایت‌های سرور کاری ندارد.
# ---------------------------------------------------------------------------

upstream payroll_app {
    # gunicorn روی لوپ‌بک؛ از بیرون سرور مستقیم در دسترس نیست
    server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name tamin.justup.ir;

    # ---- لاگ جدا برای همین سایت، تا در لاگ بقیه سایت‌ها گم نشود
    access_log /var/log/nginx/payroll.access.log;
    error_log  /var/log/nginx/payroll.error.log;

    # ---- آپلود فایل اکسل کارکرد
    client_max_body_size 20M;

    # ---- فشرده‌سازی
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
    # فونت‌های woff2 از قبل فشرده‌اند؛ دوباره فشرده نمی‌شوند

    # ---- فایل‌های استاتیک را nginx مستقیم سرو می‌کند، نه جنگو
    location /static/ {
        alias /srv/payroll/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/payroll/media/;
        access_log off;
        expires 7d;
    }

    # ---- فایل‌های مخفی و پشتیبان هرگز سرو نشوند
    location ~ /\. {
        deny all;
        access_log off;
    }
    location ~ ~$ {
        deny all;
        access_log off;
    }

    # ---- بقیه به جنگو
    location / {
        proxy_pass http://payroll_app;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect off;
        proxy_http_version 1.1;

        # محاسبه‌ی یک دوره‌ی حقوقی چند ثانیه طول می‌کشد و با رشد پرسنل بیشتر
        # می‌شود. این مقدار باید با --timeout در gunicorn هماهنگ بماند.
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
    }

    # هدرهای امنیتی را خود جنگو در حالت DEBUG=0 می‌فرستد
    # (SECURE_CONTENT_TYPE_NOSNIFF، X_FRAME_OPTIONS، SECURE_REFERRER_POLICY)
    # پس اینجا تکرار نمی‌شوند تا دو منبع حقیقت نداشته باشیم.
    server_tokens off;
}

# ---------------------------------------------------------------------------
# بعد از نصب SSL با certbot، خودش این فایل را ویرایش می‌کند و بلوک ۴۴۳ و
# ریدایرکت را اضافه می‌کند. بعدش در .env این دو را عوض کنید:
#   SECURE_COOKIES=1
#   CSRF_TRUSTED_ORIGINS=https://tamin.justup.ir
# ---------------------------------------------------------------------------
