{% load static %}{# استایل مشترک فیش A5 — بین چاپ تکی و چاپ دسته‌ای #}
<style>
  @font-face{font-family:'Vazirmatn';src:url('{% static "fonts/Vazirmatn-Regular.woff2" %}') format('woff2');font-weight:400;font-display:swap;}
  @font-face{font-family:'Vazirmatn';src:url('{% static "fonts/Vazirmatn-Medium.woff2" %}') format('woff2');font-weight:500;font-display:swap;}
  @font-face{font-family:'Vazirmatn';src:url('{% static "fonts/Vazirmatn-Bold.woff2" %}') format('woff2');font-weight:700;font-display:swap;}
  @font-face{font-family:'Vazirmatn';src:url('{% static "fonts/Vazirmatn-ExtraBold.woff2" %}') format('woff2');font-weight:800;font-display:swap;}

  :root{
    --red:#E2231A; --red-deep:#A81812;
    --ink:#1B1815; --muted:#7C7268;
    --line:#D9D2C6; --line-soft:#EDE7DC;
    --paper:#FFFFFF; --wash:#FAF7F1;
    --green:#2F7A4E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Vazirmatn', Tahoma, sans-serif;
    background:#EDEAE3; color:var(--ink);
    font-size:9pt; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding:16px;
  }
  .num{font-variant-numeric:tabular-nums;}

  /* ===== برگهٔ A5 ===== */
  .slip{
    width:148mm; min-height:210mm; margin:0 auto;
    background:var(--paper); padding:9mm 9mm 8mm;
    display:flex; flex-direction:column;
    box-shadow:0 4px 24px rgba(0,0,0,.14);
  }

  /* ===== سربرگ ===== */
  .head{display:flex; align-items:center; gap:9px; padding-bottom:7px; border-bottom:2px solid var(--ink);}
  .head img{width:34px; height:34px; flex-shrink:0;}
  .head .co b{display:block; font-size:11pt; font-weight:800; letter-spacing:-.2px; line-height:1.3;}
  .head .co span{display:block; font-size:7pt; color:var(--muted); font-weight:500;}
  .head .doc{margin-inline-start:auto; text-align:left;}
  .head .doc b{display:block; font-size:10pt; font-weight:800;}
  .head .doc span{display:block; font-size:7pt; color:var(--muted); font-weight:600;}

  /* ===== مشخصات پرسنل ===== */
  .meta{
    display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
    background:var(--line-soft); border:1px solid var(--line-soft);
    margin-top:7px;
  }
  .meta div{background:var(--wash); padding:5px 7px;}
  .meta b{display:block; font-size:6.5pt; color:var(--muted); font-weight:600; margin-bottom:1px;}
  .meta span{display:block; font-size:8.5pt; font-weight:700;}

  /* ===== دو ستون مبالغ ===== */
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px;}
  .col{border:1px solid var(--line); display:flex; flex-direction:column;}
  .col > h3{
    font-size:8pt; font-weight:800; padding:4px 7px; background:var(--wash);
    border-bottom:1px solid var(--line); display:flex; justify-content:space-between;
  }
  .col > h3 em{font-style:normal; font-weight:600; font-size:6.5pt; color:var(--muted);}
  table{width:100%; border-collapse:collapse;}
  td{padding:3px 7px; font-size:8pt; border-bottom:1px solid var(--line-soft); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  td.amt{text-align:left; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums;}
  td.qty{text-align:center; color:var(--muted); font-size:7pt; width:30px; white-space:nowrap;}
  .col .sum{margin-top:auto; border-top:1.5px solid var(--ink); background:var(--wash);}
  .col .sum td{font-weight:800; font-size:8.5pt; padding:5px 7px; border:none;}
  .why{display:block; font-size:6pt; color:var(--muted); font-weight:500; line-height:1.5; margin-top:1px;}

  /* ===== خالص ===== */
  .net{
    margin-top:8px; background:linear-gradient(115deg, var(--red) 0%, var(--red-deep) 100%);
    color:#fff; border-radius:5px; padding:9px 13px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .net .lbl{font-size:8.5pt; font-weight:700; opacity:.92;}
  .net .val{font-size:15pt; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.3px;}
  .net .val small{font-size:8pt; font-weight:600; opacity:.8;}
  .net-words{font-size:6.5pt; text-align:center; color:var(--muted); margin-top:3px;}

  /* ===== پانویس ===== */
  .box{border:1px solid var(--line); padding:5px 7px; margin-top:6px;}

  /* اطلاعات پرداخت: تمام‌عرض و دو ستونه، چون کادر «مبنای محاسبه» حذف شد و
     تنها ماندنِ یک کادر باریک در نیمهٔ برگه بدقواره بود */
  .pay-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}

  /* مرخصی: سه ستون، با عددِ شخصی درشت و سیاستِ شرکت ریز زیرش */
  .leave-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:0 10px; text-align:center;}
  .leave-grid > div{padding:1px 0;}
  .leave-grid > div + div{border-inline-start:1px solid var(--line);}
  .leave-grid .k{display:block; font-size:6.5pt; color:var(--muted); font-weight:600;}
  .leave-grid .v{display:block; font-size:9pt; font-weight:800; margin:1px 0;}
  .leave-grid .v.hi{color:var(--red-deep);}
  .leave-grid .s{display:block; font-size:6pt; color:var(--muted);}
  .box h4{font-size:6.5pt; color:var(--muted); font-weight:700; margin-bottom:3px;}
  .box .row{display:flex; justify-content:space-between; font-size:7.5pt; padding:1px 0;}
  .box .row b{font-weight:700;}
  .box .row span{color:var(--muted); font-weight:600;}

  .ack{
    margin-top:7px; border:1px solid var(--line); padding:6px 8px;
    display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:7.5pt;
  }
  .chip{
    display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:20px;
    font-size:7pt; font-weight:700;
  }
  .chip.ok{background:rgba(47,122,78,.12); color:var(--green);}
  .chip.wait{background:rgba(226,35,26,.1); color:var(--red);}
  .chip.muted{background:#EFEBE3; color:var(--muted);}

  /* متن تأیید، چسبیده به محل امضا. margin-top:auto اینجاست نه روی .sign،
     وگرنه فضای خالی صفحه بین متن و امضا پخش می‌شود و از هم جدا می‌افتند. */
  .ack-note{
    margin-top:auto; padding-top:8px; font-size:7pt; line-height:1.7; color:var(--ink);
    text-align:justify;
  }

  /* --------------------------------------------------------------- امضا
     یک ستون وسط‌چین: کادر امضا، و زیرش نامِ صاحب امضا.

     کادر **اندازهٔ ثابت** دارد و چه خالی باشد چه پر، جای یکسانی می‌گیرد؛
     وگرنه با هر امضا ارتفاع فیش تکان می‌خورد و صفحه‌بندی چاپ به هم می‌ریزد. */
  .sign{margin-top:2px; padding-top:9px; text-align:center; font-size:7pt; color:var(--muted);}
  .sign-slot{
    block-size:15mm; inline-size:54mm; margin:0 auto;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sign-name{
    border-top:1px solid var(--line); inline-size:54mm; margin:0 auto;
    padding-top:3px; font-size:7.5pt; font-weight:700; color:var(--ink);
  }
  .sign-meta{margin-top:2px; font-size:6.5pt;}

  /* کیفیت امضا نباید کم شود، و ابعاد فایل‌های اسکن‌شده با هم فرق می‌کنند:

     - `inline-size:auto` یعنی تصویر **هرگز بزرگ‌تر از اندازهٔ واقعی‌اش کشیده
       نمی‌شود**؛ فقط اگر از کادر بزرگ‌تر بود کوچک می‌شود. کشیدنِ یک اسکن
       کوچک همان چیزی است که امضا را مات و پله‌پله می‌کند.
     - `object-fit:contain` نسبت طول به عرض را نگه می‌دارد، پس امضای کشیده و
       امضای مربعی هر دو بدون له‌شدگی و بدون بریدگی جا می‌شوند.
     - `print-color-adjust:exact` جلوی کم‌رنگ کردنِ خودکار مرورگر هنگام چاپ
       را می‌گیرد؛ بدون آن، امضای مدادی روی کاغذ محو درمی‌آید. */
  .sign-img{
    max-inline-size:100%; max-block-size:100%;
    inline-size:auto; block-size:auto;
    object-fit:contain;
    print-color-adjust:exact; -webkit-print-color-adjust:exact;
  }

  .tag{font-size:6pt; color:var(--muted); text-align:center; margin-top:5px;}

  /* ===== نوار ابزار (چاپ نمی‌شود) ===== */
  .bar{width:148mm; margin:0 auto 12px; display:flex; gap:7px; justify-content:flex-end;}
  .bar button, .bar a{
    font-family:inherit; font-size:8.5pt; font-weight:700; padding:7px 14px;
    border-radius:7px; border:1px solid var(--line); background:#fff; color:var(--ink);
    cursor:pointer; text-decoration:none;
  }
  .bar .primary{background:var(--red); color:#fff; border-color:var(--red);}
  /* برچسبِ «الان کدام نسخه را می‌بینی» — سمت چپ نوار، بی‌رنگ و بی‌قاب */
  .bar .mode{margin-inline-end:auto; align-self:center; font-size:11px;
             color:var(--muted);}

  @media print{
    body{background:#fff; padding:0;}
    .bar{display:none;}
    .slip{width:auto; min-height:auto; box-shadow:none; padding:0;}
    @page{size:A5 portrait; margin:8mm;}
  }
</style>
